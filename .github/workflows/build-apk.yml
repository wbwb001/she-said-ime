name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init submodules (with retry)
        run: |
          for i in 1 2 3; do
            echo "=== submodule update attempt $i ==="
            git submodule sync --recursive && \
            git submodule update --init --recursive --force --depth 1 && {
              echo "submodule update OK"
              break
            } || echo "attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Verify Rime data submodules present
        run: |
          missing=0
          for f in \
            app/data/rime/prelude/default.yaml \
            app/data/rime/luna-pinyin/luna_pinyin.schema.yaml \
            app/data/rime/stroke/stroke.schema.yaml \
            app/data/rime/essay/essay.txt ; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "MISSING  $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Rime 数据子模块未完整拉取，终止编译"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Patch librime-lua
        run: git apply --directory=app/src/main/jni/librime-lua-deps patches/lua.patch || echo "patch skipped"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: shesaid-debug
          path: app/build/outputs/apk/debug/*.apk
